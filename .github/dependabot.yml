# Dependabot — grouped security + version updates (generated by DevOps rollout).
# Security updates are also enforced org-wide (code-security config 276473).
# `groups` defaults to version-updates, so each ecosystem adds a second group
# with applies-to: security-updates to batch security PRs too.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip-version:
        applies-to: version-updates
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
